name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      android_only:
        description: Recheck Android input/rendering without rebuilding desktop binaries
        type: boolean
        default: false
permissions:
  contents: read
env:
  GODOT_VERSION: 4.6.3
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Web loader packaging contracts
        run: |
          python3 tests/test_web_packaging.py
          python3 -m unittest discover -s tests -p test_android_packets.py
      - name: Install Godot
        run: |
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot* /usr/local/bin/godot
      - run: |
          mkdir -p build
          touch build/.gdignore
          godot --headless --editor --import --quit
      - name: Physics, menus, input and persistence
        run: |
          timeout 90 godot --headless --script tests/test_game.gd
          timeout 90 godot --headless --script tests/test_adventure.gd
          timeout 90 godot --headless --script tests/test_localization.gd
          timeout 90 godot --headless --script tests/test_evolution.gd
          timeout 90 godot --headless --script tests/test_frontier.gd
          timeout 90 godot --headless --script tests/test_motion.gd
          timeout 90 godot --headless --script tests/test_encounters.gd
          timeout 90 godot --headless --script tests/test_fidelity.gd
          timeout 90 godot --headless --script tests/test_agility.gd
          timeout 90 godot --headless --script tests/test_runner_ux.gd
          timeout 90 godot --headless --script tests/test_boss_hud.gd
          timeout 90 godot --headless --script tests/test_aionia.gd
          timeout 90 godot --headless --script tests/test_variety.gd
          timeout 90 godot --headless --script tests/test_visual_polish.gd
          timeout 90 godot --headless --script tests/test_orchard.gd
          timeout 90 godot --headless --script tests/test_firearm.gd
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.android_only != true
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-godot
          key: godot-${{ runner.os }}-4.6.3
      - name: Set up Godot and export templates
        shell: bash
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
      - name: Import
        shell: bash
        run: |
          mkdir -p build
          touch build/.gdignore
          python3 -c "import subprocess; subprocess.run(['godot','--headless','--editor','--import','--quit'],check=True,timeout=300)"
      - name: Linux packages and preview
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/linux build/web
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          godot --headless --export-release Linux
          godot --headless --export-release Web
          python3 packaging/web_updates.py
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo cp /tmp/appimagetool /usr/local/bin/appimagetool
          bash packaging/linux.sh
          tar -czf build/AionEndlessRun-0.17.1-web-offline.tar.gz -C build/web .
          timeout 15 build/linux/AionEndlessRun.x86_64 --headless -- --aion-smoke-test
          sudo apt-get install -y ./build/AionEndlessRun-0.17.1-linux-x64.deb
          timeout 15 /usr/games/AionEndlessRun --headless -- --aion-smoke-test
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 build/AionEndlessRun-0.17.1-linux-x64.AppImage --headless -- --aion-smoke-test
      - name: Windows installer and portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          $exportProcess = Start-Process -FilePath (Get-Command godot).Source -ArgumentList '--headless','--export-release','Windows' -Wait -PassThru -NoNewWindow
          if ($exportProcess.ExitCode -ne 0) { exit $exportProcess.ExitCode }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,README.md build/windows/
          Compress-Archive -Path build/windows/* -DestinationPath build/AionEndlessRun-0.17.1-windows-x64-portable.zip
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gameProcess = Start-Process -FilePath build/windows/AionEndlessRun.exe -ArgumentList '--headless','--','--aion-smoke-test' -Wait -PassThru
          if ($gameProcess.ExitCode -ne 0) { exit $gameProcess.ExitCode }
          $installProcess = Start-Process -FilePath build/AionEndlessRun-0.17.1-windows-x64-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { exit $installProcess.ExitCode }
          $installedGame = Join-Path $env:LOCALAPPDATA 'Programs/Aion Endless Run/AionEndlessRun.exe'
          if (!(Test-Path $installedGame)) { throw 'Installer did not create game executable' }
          $installedProcess = Start-Process -FilePath $installedGame -ArgumentList '--headless','--','--aion-smoke-test' -Wait -PassThru
          if ($installedProcess.ExitCode -ne 0) { exit $installedProcess.ExitCode }
      - name: macOS universal app and DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/macos
          godot --headless --export-release macOS
          mv build/macos/AionEndlessRun.zip build/AionEndlessRun-0.17.1-macos-universal-portable.zip
          ditto -xk build/AionEndlessRun-0.17.1-macos-universal-portable.zip build/dmg
          cp LICENSE THIRD_PARTY_NOTICES.md build/dmg/
          ln -s /Applications build/dmg/Applications
          python3 packaging/macos_dmg.py build/dmg build/AionEndlessRun-0.17.1-macos-universal.dmg
          find build/dmg -path '*/Contents/MacOS/*' -type f -exec chmod +x {} \;
          find build/dmg -path '*/Contents/MacOS/*' -type f -exec {} --headless -- --aion-smoke-test \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            build/AionEndlessRun-*
          if-no-files-found: error
  android_smoke:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up engine and emulator access
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
      - name: Build disposable test APK
        env:
          AION_KEY_PASSWORD: android
          AION_KEY_ALIAS: aiontest
          AION_KEYSTORE: /tmp/aion-test.keystore
        run: |
          keytool -genkeypair -keystore "$AION_KEYSTORE" -alias aiontest -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=CI Test Only'
          mkdir -p build/android
          touch build/.gdignore
          godot --headless --editor --import --quit
          python3 packaging/android_config.py
          godot --headless --export-release Android
      - name: Install and play offline in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r build/android/AionEndlessRun.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb logcat -c
            adb shell am start -W -n com.kaansavukduran.aionendlessrun/com.godot.game.GodotAppLauncher
            python3 packaging/android_input_smoke.py --output build
            adb shell pidof com.kaansavukduran.aionendlessrun
            adb logcat -d > build/android-logcat.txt
            python3 packaging/check_android_log.py build/android-logcat.txt
            python3 packaging/check_android_images.py build/android-first-launch.png build/android-paused.png build/android-owl-glide.png build/android-melee.png build/android-duck.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-evidence
          path: |
            build/android-*.png
            build/android-logcat.txt
            build/android-input-results.json
          if-no-files-found: warn
  android:
    if: github.event_name != 'pull_request' && vars.AION_ANDROID_SIGNING_READY == 'true'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Godot
        run: |
          python3 packaging/setup_godot.py
          echo "$GITHUB_WORKSPACE/.ci-godot/bin" >> "$GITHUB_PATH"
      - name: Configure stable signing identity
        env:
          KEY_B64: ${{ secrets.AION_ANDROID_KEYSTORE_B64 }}
          AION_KEY_PASSWORD: ${{ secrets.AION_ANDROID_KEY_PASSWORD }}
          AION_KEY_ALIAS: aionrelease
          AION_KEYSTORE: /tmp/aion-release.keystore
        run: |
          test -n "$KEY_B64"
          printf '%s' "$KEY_B64" | base64 -d > "$AION_KEYSTORE"
          chmod 600 "$AION_KEYSTORE"
          sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          godot --headless --editor --import --quit
          python3 packaging/android_config.py
          mkdir -p build/android
          godot --headless --export-release Android
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/AionEndlessRun.apk
          mv build/android/AionEndlessRun.apk build/AionEndlessRun-0.17.1-android-arm64-x64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/AionEndlessRun-*.apk
          if-no-files-found: error
  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' && needs.android_smoke.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    needs: [desktop, android, android_smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          path: release
          name: android
      - name: Restore the verified stable-signed Android package when CI signing is unavailable
        if: needs.android.result == 'skipped'
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("packaging/release_android.json"))["version"])')
          git fetch --no-tags --depth=1 origin "release-assets/v$VERSION"
          python3 - <<'PY'
          import json, subprocess
          m=json.load(open('packaging/release_android.json'))
          subprocess.run(['python3','packaging/restore_staged_apk.py','--version',m['version'],'--sha256',m['sha256'],'--output','release/'+m['name']],check=True)
          PY
      - name: Verify every package and publish the complete beta together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 packaging/write_release_receipt.py --version "$VERSION"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/aion-release-state; then
            test "$(cat /tmp/aion-release-state)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "Aion Endless Run $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --notes-file docs/RELEASE.md
