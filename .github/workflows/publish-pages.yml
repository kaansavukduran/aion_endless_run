name: Publish verified web game to GitHub Pages
on:
  workflow_run:
    workflows: ['Test and package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: aion-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: web-game
          path: site
      - name: Verify the exact web output of the successful platform run
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,re
          from pathlib import Path
          site=Path('site')
          meta=json.loads((site/'build.json').read_text())
          version=re.search(r'config/version="([^"]+)"',Path('project.godot').read_text()).group(1)
          assert meta['version']==version
          assert (site/'index.html').is_file()
          for name,expected in meta['assets'].items():
              f=site/name
              assert f.is_file() and f.stat().st_size==expected['bytes'],name
              with f.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
              assert actual==expected['sha256'],name
          (site/'.nojekyll').touch()
          print('Verified',version,meta['build'],'and every fingerprinted asset')
          PYCODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
