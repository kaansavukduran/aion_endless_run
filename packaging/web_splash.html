<style>
@font-face{font-family:AionPixel;src:url('__PIXEL_FONT__') format('truetype');font-display:swap}
html,body{margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
#canvas{touch-action:none;display:block;outline:none}
#status{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;box-sizing:border-box;background:#000!important;display:flex!important;align-items:center;justify-content:center;visibility:visible;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-family:AionPixel,monospace;color:#fff}
.fragaria-shell{display:flex;flex-direction:column;align-items:center;width:min(90vw,620px);gap:clamp(28px,8vh,72px)}
.fragaria-brand{display:flex;align-items:center;justify-content:center;gap:20px}
#status .fragaria-brand img{position:static!important;width:clamp(70px,18vw,122px)!important;height:160px!important;object-fit:contain;image-rendering:pixelated;filter:none!important}
.fragaria-name{font-size:clamp(28px,6vw,46px);line-height:1.15;letter-spacing:1px}
.fragaria-download{width:min(76vw,380px);text-align:left}
#aion-loading-percent{display:block;text-align:center;color:#97ff52;font-size:20px;min-height:24px}
#status-progress{position:static!important;width:100%!important;height:24px!important;margin:8px 0!important;border:3px solid #403a4e;border-radius:0;background:#d7d7da;appearance:none;accent-color:#88ed40}
#status-progress::-webkit-progress-bar{background:#d7d7da}
#status-progress::-webkit-progress-value{background:repeating-linear-gradient(90deg,transparent 0 28px,#17121c 28px 31px),linear-gradient(90deg,#ed142a,#f45b66,#8efd3c)}
#status-progress::-moz-progress-bar{background:repeating-linear-gradient(90deg,transparent 0 28px,#17121c 28px 31px),linear-gradient(90deg,#ed142a,#f45b66,#8efd3c)}
#status-notice{position:static!important;display:block;max-width:100%;box-sizing:border-box;white-space:normal;background:none!important;border:0!important;padding:8px 0!important;margin:0!important;font-family:AionPixel,monospace;font-size:20px!important;line-height:1.35;color:#eee!important;text-align:center}
.fragaria-version{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left));font-size:16px}
@media(orientation:portrait){.fragaria-brand{gap:12px}.fragaria-shell{gap:50px}#status .fragaria-brand img{height:132px!important}.fragaria-name{font-size:32px}}
</style>
<div id="status"><div class="fragaria-shell">
 <div class="fragaria-brand"><img src="__FRAGARIA__" alt="Fragaria"><div class="fragaria-name">Fragaria<br>Interactive</div></div>
 <div class="fragaria-download"><output id="aion-loading-percent" aria-live="off">…</output><progress id="status-progress" aria-label="Loading"></progress><div id="status-notice" role="status"></div></div>
</div><span class="fragaria-version">v__VERSION__</span></div>
